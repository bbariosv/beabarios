<!DOCTYPE html>
<html>
<head>
    <title>Single Book</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body { font-family: Arial; margin: 40px; }
        .book-container { border: 1px solid #ccc; padding: 20px; border-radius: 10px; }
        img { max-width: 200px; }
    </style>
</head>

<body>

<h1>Single Book Information</h1>

<div class="book-container" id="book"></div>

<script>
$(document).ready(function(){

    $.getJSON("data/google-books-book.json", function(data){

        if (data && data.volumeInfo) {
            var book = data.volumeInfo;

            var content = `
                <h2>${book.title || "No Title Available"}</h2>
                <p><strong>Authors:</strong> ${book.authors ? book.authors.join(", ") : "Unknown Author"}</p>
                <p><strong>Publisher:</strong> ${book.publisher || "Not Available"}</p>
                <p><strong>Published Date:</strong> ${book.publishedDate || "N/A"}</p>
                <p><strong>Description:</strong> ${book.description ? book.description.substring(0, 500) + "..." : "No description."}</p>
                <img src="${book.imageLinks ? book.imageLinks.thumbnail : 'https://via.placeholder.com/150'}" alt="Book Cover">
            `;

            $("#book").html(content);
        } else {
            
            $("#book").html("<p style='color:orange;'>JSON has an error or is empty</p>");
        }
    })
    .fail(function() {
        $("#book").html("<p style='color:red;'>Error.</p>");
    });
});
</script>
