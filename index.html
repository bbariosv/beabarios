<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Milestone 4 - Movie SPA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CinemaHub</h1>
        <nav>
            <button id="show-popular">Populares</button>
            <button id="show-search">Buscar</button>
        </nav>
    </header>

    <main>
        <section id="search-container" style="display:none;">
            <input type="text" id="query" placeholder="Busca una película...">
            <button id="search-btn">🔍</button>
        </section>

        <div id="view-controls">
            <button id="btn-grid">Cuadrícula</button>
            <button id="btn-list">Lista</button>
        </div>

        <div id="display-area" class="grid-layout">
            <p>Selecciona una opción para empezar...</p>
        </div>

        <div id="details-modal" style="display:none;">
            <button id="close-details">Cerrar</button>
            <div id="details-content"></div>
        </div>
    </main>

    <script id="movie-card-template" type="x-tmpl-mustache">
        {{#movies}}
        <div class="movie-card" data-id="{{id}}">
            <img src="https://image.tmdb.org/t/p/w200{{poster_path}}" alt="{{title}}">
            <div class="info">
                <h3>{{title}}</h3>
                <p>⭐ {{vote_average}}</p>
            </div>
        </div>
        {{/movies}}
    </script>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mustache.js/4.2.0/mustache.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
